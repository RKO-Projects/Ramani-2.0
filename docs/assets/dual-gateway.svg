<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="gwTitle">
  <title id="gwTitle">PWA and USSD dual gateway</title>
  <rect width="1200" height="480" fill="#0B1F2A"/>
  <text x="48" y="48" fill="#E8F3EE" font-family="Georgia, serif" font-size="24">One engine, two doors</text>
  <text x="48" y="76" fill="#8FB8A8" font-family="Segoe UI, sans-serif" font-size="14">Smartphone data when it exists. GSM USSD when it does not.</text>

  <rect x="48" y="110" width="520" height="330" rx="20" fill="#12262F"/>
  <rect x="200" y="140" width="216" height="270" rx="24" fill="#0A1216" stroke="#3D8F74" stroke-width="3"/>
  <rect x="214" y="158" width="188" height="200" rx="8" fill="#F6F1E8"/>
  <rect x="230" y="174" width="156" height="44" rx="8" fill="#C44536"/>
  <text x="308" y="202" text-anchor="middle" fill="#FFF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">SOS</text>
  <rect x="230" y="230" width="156" height="28" rx="6" fill="#0E7C66"/>
  <text x="308" y="250" text-anchor="middle" fill="#FFF" font-family="Segoe UI, sans-serif" font-size="11">Get route</text>
  <rect x="230" y="268" width="156" height="28" rx="6" fill="#12355B"/>
  <text x="308" y="288" text-anchor="middle" fill="#FFF" font-family="Segoe UI, sans-serif" font-size="11">Report hazard</text>
  <circle cx="308" cy="382" r="10" fill="#1C2E3A"/>
  <text x="308" y="430" text-anchor="middle" fill="#9EE4C8" font-family="Segoe UI, sans-serif" font-size="14">Community PWA</text>

  <rect x="632" y="110" width="520" height="330" rx="20" fill="#12262F"/>
  <rect x="800" y="140" width="184" height="270" rx="16" fill="#1A1F24" stroke="#7EB6D6" stroke-width="3"/>
  <rect x="814" y="158" width="156" height="200" rx="4" fill="#0C1410"/>
  <text x="822" y="180" fill="#7CFF9E" font-family="Consolas, monospace" font-size="11">*384*55# RAMANI</text>
  <text x="822" y="204" fill="#7CFF9E" font-family="Consolas, monospace" font-size="11">1. Emergency SOS</text>
  <text x="822" y="224" fill="#7CFF9E" font-family="Consolas, monospace" font-size="11">2. Evacuation route</text>
  <text x="822" y="244" fill="#7CFF9E" font-family="Consolas, monospace" font-size="11">3. Report hazard</text>
  <text x="822" y="264" fill="#7CFF9E" font-family="Consolas, monospace" font-size="11">4. Alert status</text>
  <text x="822" y="292" fill="#4A7A58" font-family="Consolas, monospace" font-size="10">No data required</text>
  <rect x="860" y="370" width="64" height="18" rx="4" fill="#2A3338"/>
  <text x="892" y="430" text-anchor="middle" fill="#9EC9E8" font-family="Segoe UI, sans-serif" font-size="14">USSD · Africa's Talking</text>
</svg>
